<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get dodast</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --fg:#14161a; --muted:#5b626c;
    --border:#e4e7ec; --accent:#6c5ce7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1013; --card:#171a1f; --fg:#f2f4f7; --muted:#a4abb5;
      --border:#262b32; --accent:#8b7bf0;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    max-width:420px; width:100%; padding:32px 26px; text-align:center;
    box-shadow:0 6px 30px rgba(0,0,0,.06);
  }
  .logo{
    width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--accent),#00cec9);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:30px;
  }
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 22px}
  .badges{display:flex;flex-direction:column;align-items:center;gap:12px}
  .store-badge{display:inline-flex}
  .store-badge img{display:block;width:180px;max-width:100%;height:auto}
  .hint{margin-top:18px;font-size:13px;color:var(--muted)}
  .hint a{color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">d</div>
  <h1>Get dodast</h1>
  <p>Listen together in perfect sync. Choose your store:</p>
  <div class="badges" id="badges"></div>
  <div class="hint" id="hint"></div>
</main>
<script>
(function(){
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.mkhakpaki.dodast";
  var APP_STORE_URL = "https://apps.apple.com/app/id6790904205";

  // Preserve ALL incoming query params verbatim on redirect.
  var rawQuery = location.search.replace(/^\?/, "");
  function play(){ return rawQuery ? PLAY_URL + "&" + rawQuery : PLAY_URL; }
  function appStore(){ return APP_STORE_URL + location.search; }

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  // iPadOS 13+ masquerades as Mac; treat touch-capable Macs as iPad.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && "ontouchend" in document);

  var badges = document.getElementById("badges");
  var hint = document.getElementById("hint");

  function playBadge(){
    return '<a class="store-badge" href="'+play()+'" aria-label="Get it on Google Play">'+
           '<img src="../google-play-badge.png" alt="Get it on Google Play" width="180"></a>';
  }
  function appStoreBadge(){
    return '<a class="store-badge" href="'+appStore()+'" aria-label="Download on the App Store">'+
           '<img src="../app-store-badge.svg" alt="Download on the App Store" width="180"></a>';
  }

  if (isAndroid){
    badges.innerHTML = playBadge() + appStoreBadge();
    hint.innerHTML = 'Taking you to Google Play&hellip; <a href="'+play()+'">Open manually</a>';
    location.replace(play());
  } else if (isIOS){
    badges.innerHTML = appStoreBadge() + playBadge();
    hint.innerHTML = 'Taking you to the App Store&hellip; <a href="'+appStore()+'">Open manually</a>';
    location.replace(appStore());
  } else {
    // Desktop / everything else: offer both, redirect nowhere.
    badges.innerHTML = playBadge() + appStoreBadge();
    hint.textContent = "Open this link on your phone to install dodast.";
  }
})();
</script>
</body>
</html>
